name: Linux Benchmark

# Scope (2026-10-16) — this workflow is NOT QUALIFIED for the 1.2.x runtime.
#
# It measures the Linux-NATIVE Docker cold-start number and the gVisor boundary.
# Both require Linux by construction: gVisor/runsc is a Linux kernel feature, and
# Docker runs natively only on Linux — on macOS it runs inside a VM, which is
# exactly the caveat the macOS-first README/performance tables state. The
# qualified 1.2.x runtime is wasmtime 49.0.4.post1+git.2c2970205f, wheel tag
# macosx_11_0_arm64 (embedded _libwasmtime.dylib sha256 247c1529…a30b) — macOS
# arm64 ONLY; there is no qualified Linux runtime wheel. The jobs used to install
# `-r requirements.txt` (now wasmtime>=49.0.4,<50, unsatisfiable on Linux) and
# swallow the failure with `continue-on-error: true` — a green run that proved
# nothing. Moving this to macOS is NOT the fix: it would change the measurement
# itself (VM instead of native Docker) and gVisor cannot run there at all.
#
# Both jobs now fail closed with an explicit ::error:: and no continue-on-error.
# Re-enable only once a qualified Linux runtime wheel exists — then install
# "wasmtime==49.0.4.post1+git.2c2970205f" from the release set or a verified
# build artifact, exactly as scripts/ci_runtime_bootstrap.py does for macOS.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC, after the conformance job

permissions: read-all

jobs:
  linux-docker-benchmark:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    # Deliberately no continue-on-error: a masked leg would report the run green
    # while the measurement never happened.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Runtime scope guard (fail closed — no 49.0.0 fallback)
        run: |
          echo "::error::no qualified 1.2.x runtime for Linux — this leg is NOT QUALIFIED; it measures the Linux-native Docker cold start, which cannot be produced on the qualified macOS arm64 platform, and the unpatched wasmtime 49.0.0 it would otherwise pin is not the product's runtime (see the ci.yml runtime legs and the runtime proposal)"
          exit 1

  gvisor-boundary:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    # Deliberately no continue-on-error (see the job above).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Runtime scope guard (fail closed — no 49.0.0 fallback)
        run: |
          echo "::error::no qualified 1.2.x runtime for Linux — this gVisor boundary probe needs Cell installed on Linux, and no qualified 49.0.4 runtime wheel exists for Linux (macosx_11_0_arm64 only); the unpatched wasmtime 49.0.0 is not the product's runtime (see the ci.yml runtime legs and the runtime proposal)"
          exit 1
