name: WASI Conformance

# Non-blocking-by-design evidence job: runs the official WebAssembly/wasi-testsuite
# preview-1 suite against the ephemora-cell CLI. Deliberately NOT a gate —
# the suite is external and its HEAD moves; the pinned-commit harness keeps
# runs reproducible, weekly scheduling catches drift early.
#
# Scope (2026-10-16): the tests are platform-neutral WASM binaries executed by
# the SHIPPED engine, so this now runs on the qualified platform (macOS arm64)
# with the hash-pinned runtime asset — matching the platform the committed evidence
# JSONs were produced on. Linux is NOT qualified (no qualified Linux runtime wheel), and
# the engine-abort instability documented in conformance/README.md was observed
# on ubuntu x86_64 shared runners and is NOT reproduced on macOS arm64.
# `continue-on-error` was removed: with the runtime no longer resolvable from
# PyPI, a missing/changed runtime asset or a failed identity assertion must surface as a red
# run, not be absorbed into a green one.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC, after the weekly CI schedule

permissions: read-all

# Runtime artifact. 1.2.x ships exactly ONE qualified runtime: the controlled
# wasmtime 49.0.4.post1 build (wheel tag macosx_11_0_arm64, embedded
# _libwasmtime.dylib sha256 247c1529…a30b). The runtime-wheel job builds it
# from the two pinned upstream inputs, verifies all hashes and the arm64 Mach-O,
# and hands it to this job as a workflow artifact. A missing or substituted
# input FAILS the job on purpose.

jobs:
  runtime-wheel:
    uses: ./.github/workflows/runtime-wheel.yml

  wasi-testsuite:
    needs: runtime-wheel
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Download the qualified runtime wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: qualified-wasmtime-wheel
          path: ${{ runner.temp }}/runtime-wheel

      - name: Create verified Python environment (pip 26.2.2, certifi 2026.10.19)
        run: |
          bash scripts/create_qualified_venv.sh "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies (qualified macOS arm64 runtime)
        run: |
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::error::runner is $(uname -m); the qualified runtime wheel is arm64 only"; exit 1
          fi
          python scripts/ci_runtime_bootstrap.py --wheel "$RUNNER_TEMP/runtime-wheel/wasmtime-49.0.4.post1+git.2c2970205f-py3-none-macosx_11_0_arm64.whl"
          python -m pip install -e . --no-deps
          # test-runner deps (suite pins: colorama, requests)
          python -m pip install "colorama==0.4.6" "requests==2.34.2"
          python scripts/check_ca_store.py

      # Same fail-closed identity assertion as the ci.yml runtime legs: EXACT
      # version (not a 49.0.4 prefix) + embedded dylib digest, so neither the
      # unpatched 49.0.0 nor a ".dirty"/foreign build can pass this leg.
      - name: Assert qualified runtime identity
        run: |
          python - <<'PY'
          import hashlib, importlib.metadata as md, pathlib, platform, sys
          import wasmtime

          EXPECTED_VERSION = "49.0.4.post1+git.2c2970205f"
          EXPECTED_DYLIB_SHA256 = "247c1529445001f4b6ed1d46d4f3b4a2c67f8a0c568c9e6559500eb1a89ca30b"
          version = md.version("wasmtime")
          if version != EXPECTED_VERSION:
              sys.exit(f"FAIL: installed wasmtime {version!r} != qualified {EXPECTED_VERSION!r}")
          machine = {"arm64": "aarch64", "AMD64": "x86_64"}.get(platform.machine(), platform.machine())
          lib = pathlib.Path(wasmtime.__file__).parent / f"{sys.platform}-{machine}" / "_libwasmtime.dylib"
          if not lib.exists():
              sys.exit(f"FAIL: expected runtime library {lib} not found")
          digest = hashlib.sha256(lib.read_bytes()).hexdigest()
          if digest != EXPECTED_DYLIB_SHA256:
              sys.exit(f"FAIL: loaded runtime digest {digest} != qualified {EXPECTED_DYLIB_SHA256}")
          print(f"qualified runtime: wasmtime {version}, dylib sha256 {digest}")
          PY

      - name: Run wasi-testsuite (pinned)
        env:
          # Retry wrapper: reruns once on the documented engine-abort
          # flake (SIGABRT only, retry recorded in evidence). See
          # conformance/README.md "Known runner-level instability".
          EPHEMORA_CELL: "python ${{ github.workspace }}/conformance/adapters/cell_retry_wrapper.py"
          EPHEMORA_CELL_REAL: "ephemora-cell"
        run: |
          python conformance/run_wasi_testsuite.py

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasi-conformance-results
          path: |
            conformance/results/*.json
