name: metrics

# Daily traction snapshot (PyPI downloads, GitHub stars/forks/traffic):
# publishes the current-aggregate badge JSONs (metrics/clones.json,
# metrics/downloads.json) for the README badges. The day-level series
# (history.jsonl) is intentionally NOT published — the badges already carry
# the current numbers (minimum-viable-disclosure; see AGENTS decision log).
# Read-only for main; the product never phones home (scripts/metrics_snapshot.py).

on:
  schedule:
    - cron: "23 5 * * *" # daily; off the top of the hour (pypistats etiquette)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Collect snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Traffic endpoints reject GITHUB_TOKEN even with an elevated
          # permissions block (they need administration:read, which
          # GITHUB_TOKEN cannot be granted). Optional: a fine-grained PAT
          # with Administration:read-only on this repo. Without it the
          # snapshot records traffic as null and still succeeds.
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: python scripts/metrics_snapshot.py

      - name: Persist badges on metrics branch
        run: |
          git config user.name "ephemora-cell-metrics-bot"
          git config user.email "MichaelS1011@users.noreply.github.com"
          # Stash freshly collected badges (checkout of metrics would otherwise
          # clobber them); main never carries metrics/, so this is branch-only.
          mkdir -p /tmp/badges
          for badge in clones.json downloads.json; do
            if [ -f "metrics/$badge" ]; then
              mv "metrics/$badge" "/tmp/badges/$badge"
            fi
          done
          # The snapshot script writes metrics/history.jsonl fresh into the
          # main work-tree; the metrics branch still tracks that path, so it
          # must be cleared before `git switch metrics` or git aborts the
          # switch ("untracked working tree file would be overwritten"). It is
          # not part of what we publish anymore (see the rm --ignore-unmatch below).
          rm -f metrics/history.jsonl 2>/dev/null || true
          if git ls-remote --exit-code --heads origin metrics >/dev/null; then
            git fetch origin metrics
            git switch metrics
          else
            git switch --orphan metrics
          fi
          mkdir -p metrics
          for badge in clones.json downloads.json; do
            if [ -f "/tmp/badges/$badge" ]; then
              mv "/tmp/badges/$badge" "metrics/$badge"
            fi
          done
          # Decision (2026-09-14): the day-level series is intentionally no
          # longer published — the aggregate badges carry the current numbers and
          # per-day uniques are a mineable derivative metric. This is a forward-
          # delete on a non-default orphan branch: nothing is force-pushed and no
          # public ref is rewound, so it is safe. NOTE the prior history.jsonl
          # blobs stay reachable via this branch's own earlier commits (history is
          # not rewritten here) — if those values were ever sensitive, treat them
          # as public-permanent and do NOT reintroduce them.
          git rm --ignore-unmatch --quiet metrics/history.jsonl 2>/dev/null || true
          # downloads.json only exists when the pypistats fetch succeeded
          # (null-tolerant badge); never fail the snapshot on its absence.
          git add metrics/clones.json
          git add metrics/downloads.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no change for $(date -u +%F)"
          else
            git commit -m "metrics: snapshot $(date -u +%F)"
            git push origin metrics
          fi
