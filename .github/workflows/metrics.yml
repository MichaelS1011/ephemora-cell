name: metrics

# Daily traction snapshot (PyPI downloads, GitHub stars/forks/traffic)
# appended to metrics/history.jsonl on the `metrics` branch, plus a
# shields.io endpoint JSON (metrics/clones.json) for the README badge.
# Read-only for main; the product never phones home (see
# scripts/metrics_snapshot.py).

on:
  schedule:
    - cron: "23 5 * * *" # daily; off the top of the hour (pypistats etiquette)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The snapshot script appends to (and de-duplicates) the existing
      # history, so restore it from the metrics branch BEFORE collecting —
      # main has no metrics/history.jsonl, and writing a fresh single-line
      # file would truncate the archive to one row per run.
      - name: Restore existing history from metrics branch
        run: |
          mkdir -p metrics
          if git ls-remote --exit-code --heads origin metrics > /dev/null; then
            git fetch origin metrics
            git show origin/metrics:metrics/history.jsonl > metrics/history.jsonl
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Traffic endpoints reject GITHUB_TOKEN even with an elevated
          # permissions block (they need administration:read, which
          # GITHUB_TOKEN cannot be granted). Optional: a fine-grained PAT
          # with Administration:read-only on this repo. Without it the
          # snapshot records traffic as null and still succeeds.
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: python scripts/metrics_snapshot.py

      - name: Persist on metrics branch
        run: |
          git config user.name "ephemora-cell-metrics-bot"
          git config user.email "MichaelS1011@users.noreply.github.com"
          mv metrics/history.jsonl /tmp/history.jsonl
          if [ -f metrics/clones.json ]; then
            mv metrics/clones.json /tmp/clones.json
          fi
          if git ls-remote --exit-code --heads origin metrics > /dev/null; then
            git fetch origin metrics
            git switch metrics
          else
            git switch --orphan metrics
          fi
          mkdir -p metrics
          mv /tmp/history.jsonl metrics/history.jsonl
          if [ -f /tmp/clones.json ]; then
            mv /tmp/clones.json metrics/clones.json
          fi
          git add metrics/history.jsonl metrics/clones.json
          if git diff --cached --quiet; then
            echo "no change for $(date -u +%F)"
          else
            git commit -m "metrics: snapshot $(date -u +%F)"
            git push origin metrics
          fi
