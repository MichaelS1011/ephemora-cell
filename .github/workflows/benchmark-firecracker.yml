name: Benchmark Firecracker vs Cell

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'benchmarks/competitive_benchmark.py'
      - 'benchmarks/setup_firecracker.sh'

permissions: read-all

jobs:
  firecracker:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Check KVM
        run: |
          ls -l /dev/kvm || echo "No /dev/kvm"
          kvm-ok 2>&1 | head -5 || true
      - name: Setup Firecracker
        run: bash benchmarks/setup_firecracker.sh
      # Pin the same tested wasmtime as CI (unresolved 'latest'
      # made benchmark results non-comparable across runs).
      - name: Install Cell
        run: pip install -e . && pip install wasmtime==47.0.1
      - name: Run competitive benchmark (with Firecracker)
        run: BENCH_LABEL=ubuntu-24.04-kvm python benchmarks/competitive_benchmark.py | tee competitive.log
      - name: Upload results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: competitive-firecracker
          path: |
            /tmp/ephemora_cell-competitive-*.json
            competitive.log
