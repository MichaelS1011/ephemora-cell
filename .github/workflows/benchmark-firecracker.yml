name: Benchmark Firecracker vs Cell

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'benchmarks/competitive_benchmark.py'
      - 'benchmarks/setup_firecracker.sh'

permissions: read-all

jobs:
  firecracker:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Check KVM
        run: |
          ls -l /dev/kvm || echo "No /dev/kvm"
          kvm-ok 2>&1 | head -5 || true
      - name: Setup Firecracker
        run: bash benchmarks/setup_firecracker.sh
      # Pin the same tested wasmtime as CI (unresolved 'latest'
      # made benchmark results non-comparable across runs).
      - name: Install Cell
        run: pip install -e . && pip install wasmtime==49.0.0
      - name: Run competitive benchmark (with Firecracker)
        run: BENCH_LABEL=ubuntu-24.04-kvm python benchmarks/competitive_benchmark.py | tee competitive.log
      - name: Upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: competitive-firecracker
          path: |
            /tmp/ephemora_cell-competitive-*.json
            competitive.log
