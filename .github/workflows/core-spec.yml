name: Core Spec Conformance

# Non-blocking-by-design evidence job: the OFFICIAL WebAssembly core spec suite
# (WebAssembly/testsuite, W3C Wasm 3.0 era, pinned commit) executed against
# the engine configuration Cell ships. Files run isolated (a native abort
# in an upstream module must not kill the suite); evidence JSON committed
# per run by the operator, artifact uploaded per run.
#
# Scope (2026-10-16): the suite is platform-neutral WASM and the engine under
# test is the SHIPPED one, so this now runs on the qualified platform
# (macOS arm64) with the hash-pinned runtime asset — the same platform the committed
# evidence JSONs were produced on. `wast2json` (wabt) is a build-time tool
# available on macOS via Homebrew. Linux is NOT qualified: no qualified Linux runtime
# wheel exists there, so a Linux leg could only run a vulnerable 49.x build.
# `continue-on-error` was removed: with the runtime no longer resolvable from
# PyPI, a missing/changed runtime asset or a failed identity assertion must surface as a red
# run, not be absorbed into a green one.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC, after the Linux benchmark job

permissions: read-all

# Runtime artifact. 1.2.x ships exactly ONE qualified runtime: the controlled
# wasmtime 49.0.4.post1 build (wheel tag macosx_11_0_arm64, embedded
# _libwasmtime.dylib sha256 247c1529…a30b). The runtime-wheel job builds it
# from the two pinned upstream inputs, verifies all hashes and the arm64 Mach-O,
# and hands it to this job as a workflow artifact. A missing or substituted
# input FAILS the job on purpose.

jobs:
  runtime-wheel:
    uses: ./.github/workflows/runtime-wheel.yml

  core-spec:
    needs: runtime-wheel
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Download the qualified runtime wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: qualified-wasmtime-wheel
          path: ${{ runner.temp }}/runtime-wheel

      - name: Create verified Python environment (pip 26.2.2, certifi 2026.10.19)
        run: |
          bash scripts/create_qualified_venv.sh "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies (qualified macOS arm64 runtime)
        run: |
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::error::runner is $(uname -m); the qualified runtime wheel is arm64 only"; exit 1
          fi
          python scripts/ci_runtime_bootstrap.py --wheel "$RUNNER_TEMP/runtime-wheel/wasmtime-49.0.4.post1+git.2c2970205f-py3-none-macosx_11_0_arm64.whl"
          python -m pip install -e . --no-deps
          python scripts/check_ca_store.py

      # Same fail-closed identity assertion as the ci.yml runtime legs: EXACT
      # version (not a 49.0.4 prefix) + embedded dylib digest, so neither the
      # unpatched 49.0.0 nor a ".dirty"/foreign build can pass this leg.
      - name: Assert qualified runtime identity
        run: |
          python - <<'PY'
          import hashlib, importlib.metadata as md, pathlib, platform, sys
          import wasmtime

          EXPECTED_VERSION = "49.0.4.post1+git.2c2970205f"
          EXPECTED_DYLIB_SHA256 = "247c1529445001f4b6ed1d46d4f3b4a2c67f8a0c568c9e6559500eb1a89ca30b"
          version = md.version("wasmtime")
          if version != EXPECTED_VERSION:
              sys.exit(f"FAIL: installed wasmtime {version!r} != qualified {EXPECTED_VERSION!r}")
          machine = {"arm64": "aarch64", "AMD64": "x86_64"}.get(platform.machine(), platform.machine())
          lib = pathlib.Path(wasmtime.__file__).parent / f"{sys.platform}-{machine}" / "_libwasmtime.dylib"
          if not lib.exists():
              sys.exit(f"FAIL: expected runtime library {lib} not found")
          digest = hashlib.sha256(lib.read_bytes()).hexdigest()
          if digest != EXPECTED_DYLIB_SHA256:
              sys.exit(f"FAIL: loaded runtime digest {digest} != qualified {EXPECTED_DYLIB_SHA256}")
          print(f"qualified runtime: wasmtime {version}, dylib sha256 {digest}")
          PY

      # The suite compiler is part of the measurement identity. Pinning the
      # official 1.0.42 asset (and its wast2json binary digest) replaces the
      # earlier unpinned Homebrew install, which produced different totals.
      - name: Install pinned WABT 1.0.42 (official macOS arm64 asset)
        run: |
          WABT_TARBALL="$RUNNER_TEMP/wabt-1.0.42-macos-arm64.tar.gz"
          curl -fsSL -o "$WABT_TARBALL" \
            https://github.com/WebAssembly/wabt/releases/download/1.0.42/wabt-1.0.42-macos-arm64.tar.gz
          echo "3f654779b436c628db3ca4323c51538815f5fbc887a6d5f3bb1c18d36281e240  $WABT_TARBALL" \
            | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/wabt"
          tar -xzf "$WABT_TARBALL" -C "$RUNNER_TEMP/wabt" --strip-components=1
          echo "$RUNNER_TEMP/wabt/bin" >> "$GITHUB_PATH"
          test "$(wast2json --version)" = "1.0.42"
          test "$(shasum -a 256 "$(command -v wast2json)" | awk '{print $1}')" \
            = "e4d4e15fd4938980a656cf3595a5deebf660606ea2a9acffc15555c2dca43082"

      - name: Run core spec suite (evidence; known unclassified failures exit 1)
        run: python conformance/run_core_spec.py

      - name: Upload evidence artifact (even when the known failures exit 1)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-spec-results
          path: conformance/results/core_spec_*.json
          if-no-files-found: error
