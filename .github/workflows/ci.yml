name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions: read-all

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.txt pins the exact tested wasmtime (47.0.1) for CI
          # and pip-audit; pyproject.toml declares the supported range
          # (>=43.0.1,<48). --no-deps keeps the pinned version instead of
          # downgrading.
          python -m pip install -r requirements.txt
          python -m pip install "pytest==8.4.2" "pytest-cov==7.1.0"
          # tools-signing extra: the signing-chain tests run for real, not
          # skipped (they importorskip cryptography for bare environments)
          python -m pip install "cryptography>=42"
          python -m pip install -e . --no-deps

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

      # Docs/platform truth guard: the static test-count claims in
      # README.md ("Testing & Verification", badge, freshness block) and
      # docs/comparison-mcp-servers.md must match the real pytest
      # collection (passing + skipped == collected). Strict mode is on:
      # badge/freshness drift fails CI just like the paragraph claims.
      - name: Test-count sync guard (docs vs. pytest collection)
        run: |
          CHECK_TEST_COUNT_STRICT=1 python scripts/check_test_count.py

      - name: Lint (black + ruff)
        run: |
          python -m pip install "black==26.10.0" "ruff==0.16.10"
          # ephemora_cell_mcp/ was previously un-linted; the MCP surface ships in the
          # same wheel and is now gated identically (verified clean before this line).
          python -m black --check ephemora_cell/ ephemora_cell_mcp/ tests/
          python -m ruff check ephemora_cell/ ephemora_cell_mcp/ tests/

      - name: Type check (mypy, non-strict — decision D4)
        run: |
          python -m pip install "mypy==2.4.0"
          # bare `python -m mypy` had no targets/config and checked nothing (silent
          # green no-op). Real targets now: the two shipped packages must stay clean.
          # verified green locally: `Success: no issues found in 22 source files`.
          python -m mypy ephemora_cell ephemora_cell_mcp --ignore-missing-imports

      # Integration regressions must fail CI, not be silently skipped.
      - name: Integration — subagent isolation
        run: |
          python integration/test_hermes_subagent.py --json

      - name: Integration — NemoClaw
        run: |
          python integration/test_nemoclaw_isolation.py --json

      # Order-of-magnitude latency regression guard (loose thresholds by
      # design — shared runners are noisy; fuel assertion is invariance
      # within the run, not absolute counts, which are per-platform).
      - name: Benchmark guard (order-of-magnitude latency + fuel invariance)
        run: |
          python benchmarks/benchmark_guard.py

  coverage:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest==8.4.2" "pytest-cov==7.1.0"
          python -m pip install "cryptography>=42"
          python -m pip install -e . --no-deps

      # --cov=ephemora_cell (the old run relied on pyproject addopts
      # which pointed at the misspelled 'ephemera_cell' and silently
      # measured nothing) + hard 80% gate.
      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -q --cov=ephemora_cell --cov=ephemora_cell_mcp --cov-report=xml:coverage.xml --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage.xml

  build-recipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22"

      - name: Add Rust WASM target
        run: rustup target add wasm32-wasip1

      - name: Install AssemblyScript
        run: npm install -g assemblyscript

      - name: Install Zig
        run: |
          curl -fsSL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o /tmp/zig.tar.xz
          sudo tar -xJf /tmp/zig.tar.xz -C /opt
          echo "/opt/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"

      - name: Install WASI SDK
        run: |
          curl -fsSL -o /tmp/wasi-sdk.tar.gz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sdk-25.0-x86_64-linux.tar.gz
          sudo tar -xzf /tmp/wasi-sdk.tar.gz -C /opt
          echo "WASI_SDK_PATH=/opt/wasi-sdk-25.0-x86_64-linux" >> "$GITHUB_ENV"

      - name: Install dependencies (incl. pytest via the dev extra)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
          python -m pip install "pytest==8.4.2" "pytest-cov==7.1.0"

      # Real toolchain builds (rust + go) run in CI
      - name: Run builder tests with real toolchains
        run: python -m pytest tests/test_builder.py -v --tb=short

  security:
    runs-on: ubuntu-latest
    # No job-level `permissions:` override: the workflow default is `read-all`.
    # Two other workflows already upload artifacts under `read-all` and their
    # upload steps report success ("WASI Conformance" run 36416665803,
    # "Linux Benchmark" run 36420197406), so the SBOM upload here needs no more;
    # this run's own `Upload SBOM` step is the check that the claim holds for this
    # job too. An extra `actions: write` would be surface, not need.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # version-sync guard needs the tags

      - name: Version-sync guard (sources must agree; newest tag may lag the bump by design)
        run: python scripts/check_version_sync.py

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies and audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
          python -m pip install "pip-audit==2.10.1" "cyclonedx-bom==7.5.0"

      - name: CVE scan (pip-audit)
        run: |
          pip-audit -r requirements.txt

      # SAST scope: production code only. tests/ is excluded deliberately —
      # it contains documented fake positive-control secrets (e.g.
      # argv-secret-7f3a) that exist to prove secrets never reach worker
      # surfaces; ruff already covers test code style/correctness.
      - name: SAST (bandit)
        run: |
          python -m pip install "bandit==1.9.4"
          bandit -r ephemora_cell/ ephemora_cell_mcp/ -ll

      # SBOM from the INSTALLED environment (true dependency tree,
      # includes the package itself), not from a requirements listing.
      - name: Generate SBOM (CycloneDX, installed metadata)
        run: |
          cyclonedx-py environment -o sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom.json

  # Test-bench wiring: the documented attack-vector suite and the
  # auto-grader verdict contract run on every push/PR — the 8/8 boundary
  # claim is continuously re-proven on the pinned wasmtime baseline, not
  # asserted once (README documents the suite; CI keeps it true).
  test-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps

      # Exit 0 = all 8 documented vectors blocked on the live runtime.
      - name: Attack vectors (8/8 boundary gate)
        run: python benchmarks/verify_8_vectors.py

      # The three reference submissions must keep their exact verdict
      # mapping (pass / compute budget / memory budget) — any drift in
      # status mapping or budget enforcement fails the job.
      - name: Auto-grader verdict contract (--strict)
        run: python examples/auto_grader.py --strict

  # Verifies the shipped server against the OFFICIAL MCP Python SDK (stdio):
  # initialize, tools/list, a real echo tools/call with execution _meta. This
  # is the "verified against the official SDK" evidence and runs the test for
  # real (not green-by-skip) because the entry point is installed on PATH.
  mcp-sdk-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps + this package (entry point on PATH) + MCP SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest==8.4.2" -e ".[integration]"

      - name: Official MCP SDK interop
        # -o addopts= drops the project-wide coverage addopts: this job
        # installs pytest without pytest-cov on purpose (interop, not
        # coverage — the test jobs own that).
        run: python -m pytest integration/test_mcp_sdk_client.py -v --tb=short -o addopts=""

  # The required status check on `main` is this job's name, and it is configured:
  # `required_status_checks.contexts == ["release-gate"]`, `strict: true`,
  # `enforce_admins: true` (read back from the API after setting it, not assumed).
  # It is an aggregate, not one of the matrix legs, on purpose: before this job
  # existed `main` had no required check at all (`contexts: []`), so nothing gated
  # a red commit, and a leg name like `test (ubuntu-latest, 3.10)` would have to be
  # re-registered every time the matrix changes. `if: always()` makes it report
  # even when a leg fails, and then it fails itself, naming the count and states.
  # Measured, not inferred: the check also gates a DIRECT push. Pushing this very
  # commit to `main` was refused with `GH006 … Required status check "release-gate"
  # is expected` — a commit whose required checks have not reported cannot become
  # `main` at all. The practical consequence for a solo repository is that work
  # lands through a branch and a pull request, which is the point of the rule.
  release-gate:
    runs-on: ubuntu-latest
    needs: [test, coverage, build-recipes, security, test-bench, mcp-sdk-interop]
    if: always()
    steps:
      - name: All required legs green?
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "leg results: $RESULTS"
          python - <<'PY'
          import json, os, sys
          results = json.loads(os.environ["RESULTS"])
          bad = [r for r in results if r != "success"]
          if bad:
              print(f"::error::release-gate: {len(bad)} of {len(results)} required legs not "
                    f"successful ({', '.join(bad)}). A cancelled or skipped leg counts as "
                    "not-green on purpose: it proves nothing.")
              sys.exit(1)
          print(f"release-gate: all {len(results)} required legs success")
          PY
