name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions: read-all

# Runtime artifact. 1.2.x ships exactly ONE qualified runtime: the controlled
# wasmtime 49.0.4.post1 build (wheel tag macosx_11_0_arm64, embedded
# _libwasmtime.dylib sha256 247c1529…a30b). PyPI carries no 49.0.4 wheel and no
# intermediate release is published; the runtime-wheel job builds it from the
# two pinned upstream inputs with the checked-in recipe, verifies the input
# hashes, wheel sha256, native sha256 and arm64 Mach-O, and hands the wheel to
# every dependent job as a workflow artifact. A missing or substituted input is
# a red leg; there is no 49.0.0 fallback and no local cache.
#
# Runner: macos-15 (arm64). GitHub retires the macos-14 image on 2026-11-02
# (brownouts from 2026-10-05; actions/runner-images#13518). macos-15 is the
# arm64 image; macos-15-intel is x64 and would fail the bootstrap's arm64 gate.

jobs:
  runtime-wheel:
    uses: ./.github/workflows/runtime-wheel.yml

  test:
    needs: runtime-wheel
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # 1.2.x is qualified on macOS arm64 only. The former ubuntu-latest legs are
        # NOT removed because Linux is uninteresting — they are removed because no
        # qualified 49.0.4 runtime exists for Linux (the wheel is macOS arm64 only):
        # such a leg could only run a vulnerable 49.x build or would have to be masked.
        # Re-add a Linux leg once a Linux runtime has been qualified.
        os: [macos-15] # arm64 image; matches the wheel tag macosx_11_0_arm64
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Download the qualified runtime wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: qualified-wasmtime-wheel
          path: ${{ runner.temp }}/runtime-wheel

      - name: Create verified Python environment (pip 26.2.2, certifi 2026.10.19)
        run: |
          bash scripts/create_qualified_venv.sh "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies (qualified macOS arm64 runtime)
        run: |
          # Platform gate BEFORE any install: this leg is only meaningful on the
          # qualified platform, and macOS arm64 is the only one with a runtime wheel.
          if [ "$RUNNER_OS" != "macOS" ] || [ "$(uname -m)" != "arm64" ]; then
            echo "::error::runtime leg requires the qualified platform macOS arm64 (macos-15); runner is $RUNNER_OS/$(uname -m) — NOT QUALIFIED"
            exit 1
          fi
          echo "runner macOS $(sw_vers -productVersion) $(uname -m), python $(python -VV)"
          # Install only the wheel this run built from pinned upstream inputs.
          # The bootstrap re-checks name, wheel hash, native hash and arch, then
          # verifies the loaded library. No index, no fallback to 49.0.0.
          python scripts/ci_runtime_bootstrap.py --wheel "$RUNNER_TEMP/runtime-wheel/wasmtime-49.0.4.post1+git.2c2970205f-py3-none-macosx_11_0_arm64.whl"
          python -m pip install "pytest==9.0.3" "pytest-cov==7.1.0"
          # tools-signing extra: the signing-chain tests run for real, not
          # skipped (they importorskip cryptography for bare environments)
          python -m pip install "cryptography>=42"
          python -m pip install -e . --no-deps
          python scripts/check_ca_store.py

      # Fail-closed identity assertion: the runtime that is actually installed and
      # loaded must be the ONE qualified artifact — an EXACT version match, not a
      # 49.0.4 prefix (a ".dirty"/foreign build sharing the prefix must not pass),
      # plus the embedded dylib digest pinned in requirements.lock/release notes.
      - name: Assert qualified runtime identity
        run: |
          python - <<'PY'
          import hashlib, importlib.metadata as md, pathlib, platform, sys
          import wasmtime

          EXPECTED_VERSION = "49.0.4.post1+git.2c2970205f"
          EXPECTED_DYLIB_SHA256 = "247c1529445001f4b6ed1d46d4f3b4a2c67f8a0c568c9e6559500eb1a89ca30b"
          version = md.version("wasmtime")
          if version != EXPECTED_VERSION:
              sys.exit(f"FAIL: installed wasmtime {version!r} != qualified {EXPECTED_VERSION!r}")
          machine = {"arm64": "aarch64", "AMD64": "x86_64"}.get(platform.machine(), platform.machine())
          lib = pathlib.Path(wasmtime.__file__).parent / f"{sys.platform}-{machine}" / "_libwasmtime.dylib"
          if not lib.exists():
              sys.exit(f"FAIL: expected runtime library {lib} not found")
          digest = hashlib.sha256(lib.read_bytes()).hexdigest()
          if digest != EXPECTED_DYLIB_SHA256:
              sys.exit(f"FAIL: loaded runtime digest {digest} != qualified {EXPECTED_DYLIB_SHA256}")
          print(f"qualified runtime: wasmtime {version}, dylib sha256 {digest}")
          PY

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

      # Docs/platform truth guard: the static test-count claims in
      # README.md ("Testing & Verification", badge, freshness block) and
      # docs/comparison-mcp-servers.md must match the real pytest
      # collection (passing + skipped == collected). Strict mode is on:
      # badge/freshness drift fails CI just like the paragraph claims.
      - name: Test-count sync guard (docs vs. pytest collection)
        run: |
          CHECK_TEST_COUNT_STRICT=1 python scripts/check_test_count.py

      - name: Lint (black + ruff)
        run: |
          python -m pip install "black==26.10.1" "ruff==0.16.10"
          # ephemora_cell_mcp/ was previously un-linted; the MCP surface ships in the
          # same wheel and is now gated identically (verified clean before this line).
          python -m black --check ephemora_cell/ ephemora_cell_mcp/ tests/
          python -m ruff check ephemora_cell/ ephemora_cell_mcp/ tests/

      - name: Type check (mypy, non-strict)
        run: |
          python -m pip install "mypy==2.4.0"
          # bare `python -m mypy` had no targets/config and checked nothing (silent
          # green no-op). Real targets now: the two shipped packages must stay clean.
          # verified green on this tree: `Success: no issues found in 49 source
          # files` (mypy 2.4.0, the pin above; 49 once the VM/IPC modules joined the
          # shipped set, and the comment said 41 for as long as nobody re-ran the step
          # against that set — the counts in comments rot, which is why the gate, not
          # the sentence, decides).
          python -m mypy ephemora_cell ephemora_cell_mcp --ignore-missing-imports

      # Integration regressions must fail CI, not be silently skipped.
      - name: Integration — subagent isolation
        run: |
          python integration/test_hermes_subagent.py --json

      - name: Integration — NemoClaw
        run: |
          python integration/test_nemoclaw_isolation.py --json

      # Order-of-magnitude latency regression guard (loose thresholds by
      # design — shared runners are noisy; fuel assertion is invariance
      # within the run, not absolute counts, which are per-platform).
      - name: Benchmark guard (order-of-magnitude latency + fuel invariance)
        run: |
          python benchmarks/benchmark_guard.py

  coverage:
    needs: runtime-wheel
    # Runtime-backed leg (the suite executes WASM), hence the qualified platform.
    runs-on: macos-15
    # No job-level `permissions:` override. This job checks out, installs, runs the
    # suite and uploads one artefact — none of which needs a write scope. The
    # previous `actions: write` override was the only unnecessary grant in the
    # workflow, and the same upload step succeeds under the workflow default
    # `read-all` in the WASI-conformance and SBOM jobs (documented below at the
    # `test-bench` job, with the run id that was read back).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Download the qualified runtime wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: qualified-wasmtime-wheel
          path: ${{ runner.temp }}/runtime-wheel

      - name: Create verified Python environment (pip 26.2.2, certifi 2026.10.19)
        run: |
          bash scripts/create_qualified_venv.sh "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies (qualified macOS arm64 runtime)
        run: |
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::error::runner is $(uname -m); the qualified runtime wheel is arm64 only"; exit 1
          fi
          python scripts/ci_runtime_bootstrap.py --wheel "$RUNNER_TEMP/runtime-wheel/wasmtime-49.0.4.post1+git.2c2970205f-py3-none-macosx_11_0_arm64.whl"
          python -m pip install "pytest==9.0.3" "pytest-cov==7.1.0"
          python -m pip install "cryptography>=42"
          python -m pip install -e . --no-deps
          python scripts/check_ca_store.py

      # --cov=ephemora_cell (the old run relied on pyproject addopts
      # which pointed at the misspelled 'ephemera_cell' and silently
      # measured nothing) + hard 80% gate.
      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -q --cov=ephemora_cell --cov=ephemora_cell_mcp --cov-report=xml:coverage.xml --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage.xml

  # NOT in the required `release-gate` (see `needs:` there): this leg builds the
  # guest toolchains on Linux and then needs a runtime to exercise them. Linux has
  # no qualified 49.0.4 runtime wheel for 1.2.x, so the leg cannot be green without
  # either masking or falling back to the unpatched 49.0.0 — both excluded. It stays
  # in the workflow so the gap is visible, and it fails loudly instead of passing
  # as a half-run. Re-add to `needs:` once a Linux runtime is qualified.
  build-recipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22"

      - name: Add Rust WASM target
        run: rustup target add wasm32-wasip1

      - name: Install pinned Node.js 22.23.4 (official linux-x64 asset)
        run: |
          NODE_TARBALL="$RUNNER_TEMP/node-v22.23.4-linux-x64.tar.gz"
          curl -fsSL -o "$NODE_TARBALL" \
            https://nodejs.org/dist/v22.23.4/node-v22.23.4-linux-x64.tar.gz
          echo "b8492284c76a54baf58d61668dd0e41ee0fc98adabf9503d30f05d08f55b4406  $NODE_TARBALL" \
            | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/node"
          tar -xzf "$NODE_TARBALL" -C "$RUNNER_TEMP/node" --strip-components=1
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
          # GITHUB_PATH only affects LATER steps, so this assertion has to use the
          # absolute path: `node` here still resolves to the runner's own Node and
          # the check would compare the wrong binary — measured on this branch's
          # first PR run, where the whole leg died on exactly that comparison.
          test "$("$RUNNER_TEMP/node/bin/node" --version)" = "v22.23.4"

      - name: Install AssemblyScript
        run: npm install -g assemblyscript@0.28.20

      - name: Install Zig
        run: |
          curl -fsSL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o /tmp/zig.tar.xz
          echo "d45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea  /tmp/zig.tar.xz" \
            | sha256sum -c -
          sudo tar -xJf /tmp/zig.tar.xz -C /opt
          echo "/opt/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"

      - name: Install WASI SDK
        run: |
          curl -fsSL -o /tmp/wasi-sdk.tar.gz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sdk-25.0-x86_64-linux.tar.gz
          sudo tar -xzf /tmp/wasi-sdk.tar.gz -C /opt
          echo "WASI_SDK_PATH=/opt/wasi-sdk-25.0-x86_64-linux" >> "$GITHUB_ENV"

      - name: Install dependencies (incl. pytest via the dev extra)
        run: |
          python -m pip install --upgrade pip
          # Fail-closed, explicit: instead of a pip resolution error that could be
          # "fixed" by installing PyPI's 49.0.0, this leg states why it is not a
          # qualified green. Runtime-independent guest builds cannot be separated
          # from the runtime checks in tests/test_builder.py without weakening them.
          echo "::error::no qualified 49.0.4 runtime for Linux — this leg is NOT QUALIFIED for 1.2.x and is excluded from the required gate; see the runtime proposal"
          exit 1

      # Real toolchain builds (rust + go) run in CI
      - name: Run builder tests with real toolchains
        run: python -m pytest tests/test_builder.py -v --tb=short

  security:
    needs: runtime-wheel
    # Static guards + the SBOM from the installed environment. On the qualified
    # platform so the SBOM names the real runtime (wasmtime 49.0.4.postN) instead
    # of an environment where the runtime could not be installed at all.
    runs-on: macos-15
    # No job-level `permissions:` override: the workflow default is `read-all`.
    # Two other workflows already upload artifacts under `read-all` and their
    # upload steps report success ("WASI Conformance" run 36416665803,
    # "Linux Benchmark" run 36420197406), so the SBOM upload here needs no more;
    # this run's own `Upload SBOM` step is the check that the claim holds for this
    # job too. An extra `actions: write` would be surface, not need.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # version-sync guard needs the tags

      - name: Version-sync guard (sources must agree; newest tag may lag the bump by design)
        run: python scripts/check_version_sync.py

      # Public/private separation: the tracked tree must carry product,
      # engineering and verifiable evidence — not internal governance words,
      # personal home paths or credential shapes. Rules are structural and
      # generic (scripts/public_content_guard.json); confidential specifics
      # live only in an optional local overlay that never reaches the repo.
      - name: Public-content guard (tracked tree)
        run: python scripts/check_public_content.py

      # The tree guard sees only the tip; a file committed-then-deleted stays
      # publicly reachable through history (the committed-then-deleted
      # internal-doc class).
      # This leg fails closed if any commit NEW to this push/PR introduces a
      # forbidden internal path OR internal identifier content. The range is
      # exactly the set of blobs no public ref has carried yet, so the
      # contextual internal-id rules (--strict-ids) can be applied here without
      # re-litigating published history. Pre-existing public-history items are
      # tracked separately, not silently re-scanned here.
      - name: Public-content guard (git history — no reintroduced internal paths)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "${BASE:-0}^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse HEAD^ 2>/dev/null || echo '')"
          fi
          if [ -n "$BASE" ]; then
            python scripts/distribution_guard.py history --ref "${BASE}..HEAD" --content --strict-ids
          else
            echo "single-commit history; scanning HEAD"
            python scripts/distribution_guard.py history --ref HEAD --content --strict-ids
          fi

      # Security-number consistency: the arXiv 11-strategy table, its summary
      # and the marketing mirrors must agree (7/3/1), no OSS "18/18 blocked"
      # claim, and the consolidated attack matrix must stay linked from the
      # public docs. Catches a headline number drifting from the evidence below it.
      - name: Security-claims guard (public docs)
        run: python scripts/check_security_claims.py

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Download the qualified runtime wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: qualified-wasmtime-wheel
          path: ${{ runner.temp }}/runtime-wheel

      # Two clean environments: the product tree that is audited and the
      # audit/SBOM tool tree. Installing pip-audit next to the product is what
      # made the runner's global certifi look like a product dependency.
      - name: Create isolated product and audit environments (verified pip/certifi)
        run: |
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::error::runner is $(uname -m); the qualified runtime wheel is arm64 only"; exit 1
          fi
          bash scripts/create_qualified_venv.sh "$RUNNER_TEMP/product-venv"
          bash scripts/create_qualified_venv.sh "$RUNNER_TEMP/audit-venv"
          "$RUNNER_TEMP/audit-venv/bin/python" -m pip install \
            "pip-audit==2.10.1" "cyclonedx-bom==7.5.0" "bandit==1.9.4" \
            "build==1.2.2" "cryptography>=42"
          "$RUNNER_TEMP/product-venv/bin/python" scripts/ci_runtime_bootstrap.py --wheel "$RUNNER_TEMP/runtime-wheel/wasmtime-49.0.4.post1+git.2c2970205f-py3-none-macosx_11_0_arm64.whl"

      # Confidentiality gate on the actual DISTRIBUTION surface: an internal file
      # that never appears in the tree can still be packaged. Build both the
      # wheel and the sdist and assert no forbidden internal path or content is
      # inside them. Fail-closed: no artifacts found is a build error.
      - name: Build distributions, guard contents, install the product wheel
        run: |
          "$RUNNER_TEMP/audit-venv/bin/python" -m build --wheel --sdist --outdir dist
          "$RUNNER_TEMP/audit-venv/bin/python" scripts/distribution_guard.py artifacts "dist/*"
          "$RUNNER_TEMP/product-venv/bin/python" -m pip install \
            --no-index --no-deps dist/ephemora_cell-1.2.0-py3-none-any.whl

      # The product environment is the thing audited. The active certifi and
      # pip bundles must be the fixed ones; the OS store is reported separately.
      - name: CA store check (active product environment)
        run: |
          "$RUNNER_TEMP/product-venv/bin/python" scripts/check_ca_store.py

      # Audits the INSTALLED product environment, not the audit tool tree and
      # not a requirements listing. The custom wasmtime build is covered by the
      # advisory watcher below; pip-audit reports it as a local package it
      # cannot resolve on PyPI, which is expected and visible in the log.
      - name: CVE scan (pip-audit on the third-party dependencies)
        run: |
          # pip-audit resolves every *installed* distribution against PyPI, so the
          # two artifacts this project builds itself — ephemora_cell at this commit
          # and wasmtime from the qualified 49.0.4 build — make it exit 1 with
          # "not found on PyPI" without auditing anything (measured on this
          # branch's first PR run). Suppressing that error would turn the step
          # green while auditing nothing, so the scan runs on a copy of the very
          # environment the product uses, minus exactly those two metadata
          # entries, and names them in the log:
          #   * the product wheel is pinned by scripts/release_manifest.py, and
          #   * the engine line is watched for upstream advisories by the
          #     check_wasmtime_advisories.py step below, which exists precisely
          #     because advisories are published before a wheel appears.
          shopt -s nullglob
          SITE="$RUNNER_TEMP/product-venv/lib/python3.12/site-packages"
          SCAN="$RUNNER_TEMP/audit-scan"
          rm -rf "$SCAN"; cp -R "$SITE" "$SCAN"
          for dist in "$SCAN"/ephemora_cell-*.dist-info "$SCAN"/wasmtime-*.dist-info; do
            echo "not audited here (built by this project, pinned elsewhere): $(basename "$dist")"
            rm -rf "$dist"
          done
          "$RUNNER_TEMP/audit-venv/bin/pip-audit" --path "$SCAN" --progress-spinner off

      # SAST scope: production code only. tests/ is excluded deliberately —
      # it contains documented fake positive-control secrets (e.g.
      # argv-secret-7f3a) that exist to prove secrets never reach worker
      # surfaces; ruff already covers test code style/correctness.
      - name: SAST (bandit)
        run: |
          "$RUNNER_TEMP/audit-venv/bin/bandit" -r ephemora_cell/ ephemora_cell_mcp/ -ll

      # Upstream advisories are published before (or without) a PyPI wheel;
      # the 2026-10 aarch64 br_table escape is the example. Fail closed when a
      # published advisory matches the pinned runtime version.
      - name: Watch Wasmtime security advisories
        run: |
          "$RUNNER_TEMP/product-venv/bin/python" scripts/check_wasmtime_advisories.py

      # SBOM from the INSTALLED product environment (true dependency tree,
      # includes the package itself and certifi), not from a requirements listing.
      - name: Generate SBOM (CycloneDX, installed product environment)
        run: |
          "$RUNNER_TEMP/audit-venv/bin/cyclonedx-py" environment \
            "$RUNNER_TEMP/product-venv/bin/python" \
            --pyproject pyproject.toml -o sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.json

  # Test-bench wiring: the documented attack-vector suite and the
  # auto-grader verdict contract run on every push/PR — the 8/8 boundary
  # claim is continuously re-proven on the pinned wasmtime baseline, not
  # asserted once (README documents the suite; CI keeps it true).
  test-bench:
    needs: runtime-wheel
    # Executes WASM on the live runtime → qualified platform only.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Download the qualified runtime wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: qualified-wasmtime-wheel
          path: ${{ runner.temp }}/runtime-wheel

      - name: Create verified Python environment (pip 26.2.2, certifi 2026.10.19)
        run: |
          bash scripts/create_qualified_venv.sh "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies (qualified macOS arm64 runtime)
        run: |
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::error::runner is $(uname -m); the qualified runtime wheel is arm64 only"; exit 1
          fi
          python scripts/ci_runtime_bootstrap.py --wheel "$RUNNER_TEMP/runtime-wheel/wasmtime-49.0.4.post1+git.2c2970205f-py3-none-macosx_11_0_arm64.whl"
          python -m pip install -e . --no-deps
          python scripts/check_ca_store.py

      # Exit 0 = all 8 documented vectors blocked on the live runtime.
      - name: Attack vectors (8/8 boundary gate)
        run: python benchmarks/verify_8_vectors.py

      # The three reference submissions must keep their exact verdict
      # mapping (pass / compute budget / memory budget) — any drift in
      # status mapping or budget enforcement fails the job.
      - name: Auto-grader verdict contract (--strict)
        run: python examples/auto_grader.py --strict

  # Verifies the shipped server against the OFFICIAL MCP Python SDK (stdio):
  # initialize, tools/list, a real echo tools/call with execution _meta. This
  # is the "verified against the official SDK" evidence and runs the test for
  # real (not green-by-skip) because the entry point is installed on PATH.
  mcp-sdk-interop:
    needs: runtime-wheel
    # The server executes WASM in this test → qualified platform only.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Download the qualified runtime wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: qualified-wasmtime-wheel
          path: ${{ runner.temp }}/runtime-wheel

      - name: Create verified Python environment (pip 26.2.2, certifi 2026.10.19)
        run: |
          bash scripts/create_qualified_venv.sh "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install deps + this package (entry point on PATH) + MCP SDK
        run: |
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::error::runner is $(uname -m); the qualified runtime wheel is arm64 only"; exit 1
          fi
          python scripts/ci_runtime_bootstrap.py --wheel "$RUNNER_TEMP/runtime-wheel/wasmtime-49.0.4.post1+git.2c2970205f-py3-none-macosx_11_0_arm64.whl"
          python -m pip install "pytest==9.0.3" "mcp==2.2.0"
          python -m pip install -e . --no-deps
          python scripts/check_ca_store.py

      - name: Official MCP SDK interop
        # -o addopts= drops the project-wide coverage addopts: this job
        # installs pytest without pytest-cov on purpose (interop, not
        # coverage — the test jobs own that).
        # The second file is the agent-to-sandbox E2E the product contract
        # names: model-authored WASM registered and executed through the
        # official client, plus the enforced refusal and the fuel stop on the
        # same path. If it is removed from this command, the contract guard
        # fails, because a capability may only be `supported` on evidence that
        # something actually runs.
        run: |
          python -m pytest integration/test_mcp_sdk_client.py -v --tb=short -o addopts=""
          python -m pytest integration/test_agent_code_execution_mcp.py -v --tb=short -o addopts=""
          python -m pytest integration/test_mcp_advisories.py -v --tb=short -o addopts=""

  # The required status check on `main` is this job's name, and it is configured:
  # `required_status_checks.contexts == ["release-gate"]`, `strict: true`,
  # `enforce_admins: true` (read back from the API after setting it, not assumed).
  # It is an aggregate, not one of the matrix legs, on purpose: before this job
  # existed `main` had no required check at all (`contexts: []`), so nothing gated
  # a red commit, and a leg name like `test (ubuntu-latest, 3.10)` would have to be
  # re-registered every time the matrix changes. `if: always()` makes it report
  # even when a leg fails, and then it fails itself, naming the count and states.
  # Measured, not inferred: the check also gates a DIRECT push. Pushing this very
  # commit to `main` was refused with `GH006 … Required status check "release-gate"
  # is expected` — a commit whose required checks have not reported cannot become
  # `main` at all. The practical consequence for a solo repository is that work
  # lands through a branch and a pull request, which is the point of the rule.
  #
  # `build-recipes` is intentionally NOT in `needs:` (see the job comment above):
  # no qualified 49.0.4 runtime exists for Linux in 1.2.x, so that leg cannot be
  # green without masking or downgrading the engine.
  release-gate:
    runs-on: ubuntu-latest
    needs: [test, coverage, security, test-bench, mcp-sdk-interop]
    if: always()
    steps:
      - name: All required legs green?
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "leg results: $RESULTS"
          python - <<'PY'
          import json, os, sys
          results = json.loads(os.environ["RESULTS"])
          bad = [r for r in results if r != "success"]
          if bad:
              print(f"::error::release-gate: {len(bad)} of {len(results)} required legs not "
                    f"successful ({', '.join(bad)}). A cancelled or skipped leg counts as "
                    "not-green on purpose: it proves nothing.")
              sys.exit(1)
          print(f"release-gate: all {len(results)} required legs success")
          PY
