name: Debug defect B (full suite on macOS 3.10.11, traceback at the catch site)

# Throwaway diagnostic branch cut from 3094a4b. Round 1 answered three
# questions: raw wasmtime 47.0.1 is clean on this runner (it traps "all fuel
# consumed" as expected), one minimal Cell guest run succeeds (FUEL_EXHAUSTED /
# SUCCESS), and the two failing pytest cases PASS when run alone. So the failure
# is a state produced by the full-suite run itself — not the interpreter build,
# not wasmtime. Round 2 runs the whole suite and records, at the catch site, the
# test that was executing plus the internal traceback, in a file (immune to
# pytest's output capture).

on:
  push:
    branches: [debug/defect-b-macos310]
  workflow_dispatch:

permissions: read-all

jobs:
  trace:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.10.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10.11"
          cache: pip

      - name: Install dependencies (same pins as CI)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest<9" pytest-cov "cryptography>=42"
          python -m pip install -e . --no-deps

      - name: Full suite with per-catch-site traceback recording
        env:
          CELL_DEBUG_TB_FILE: /tmp/cell_tb.txt
        run: |
          python -m pytest tests/ -q --tb=line -p no:cacheprovider --no-cov > /tmp/full.log 2>&1 || true
          echo "=== summary ==="
          tail -3 /tmp/full.log
          echo "=== records written ==="
          echo "tracebacks: $(grep -c '^Traceback' /tmp/cell_tb.txt || echo 0)"
          echo "=== first 60 lines of the record (test + frames) ==="
          head -60 /tmp/cell_tb.txt

      - name: Which test polluted, grouped
        if: always()
        run: |
          echo "=== tests that produced an internal traceback ==="
          grep '^TEST:' /tmp/cell_tb.txt | sed 's/ (call).*//;s/ (setup).*//;s/ (teardown).*//' | sort | uniq -c | sort -rn | head -15
          echo "=== frames of those tracebacks ==="
          grep -E 'File "' /tmp/cell_tb.txt | sed 's/^ *//' | sort | uniq -c | sort -rn | head -20
          echo "=== first line of each recorded error ==="
          grep -E '^[A-Za-z_.]*(Error|Exception|Trap)' /tmp/cell_tb.txt | sort | uniq -c | sort -rn | head -10

      - name: Environment
        if: always()
        run: |
          python -VV
          python -c 'import sys,platform;print(sys.executable, platform.machine(), platform.mac_ver())'
