name: Debug defect B (exact CI invocation on macOS 3.10.11)

# Round 1 ruled out wasmtime and the interpreter build: raw wasmtime 47.0.1 traps
# "all fuel consumed" correctly on this runner, and one minimal Cell guest run
# returns FUEL_EXHAUSTED / SUCCESS. Round 2 ran the whole suite with
# `--no-cov --tb=line`: 948 passed, 2 failed — the two SSRF cases only, no
# defect-B string anywhere. So the 19 guest-run failures in the release CI run
# are produced by the invocation the release run uses, not by the machine.
#
# Round 3 reproduces that invocation exactly (`pytest tests/ -v --tb=short`, so
# the pyproject coverage addopts are active) and records the test name plus the
# internal traceback at the catch site. The record is written to a file because
# pytest captures stderr, and ExitTrap (a normal guest exit) is filtered out.

on:
  push:
    branches: [debug/defect-b-macos310]
  workflow_dispatch:

permissions: read-all

jobs:
  trace:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.10.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10.11"
          cache: pip

      - name: Install dependencies (same pins as CI)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest<9" pytest-cov "cryptography>=42"
          python -m pip install -e . --no-deps
          python -m pip freeze | grep -iE "^(pytest|coverage|wasmtime)" 

      - name: Exact CI invocation, traceback recorded at the catch site
        env:
          CELL_DEBUG_TB_FILE: /tmp/cell_tb.txt
        run: |
          python -m pytest tests/ -v --tb=short > /tmp/full.log 2>&1 || true
          echo "=== summary ==="
          tail -3 /tmp/full.log
          echo "=== FAILED lines ==="
          grep -E "^FAILED" /tmp/full.log | head -30
          echo "=== defect-B occurrences in the log ==="
          grep -c "list indices must be integers" /tmp/full.log || true

      - name: First recorded non-ExitTrap traceback
        if: always()
        run: |
          python - <<'PY'
          import re, pathlib
          p = pathlib.Path("/tmp/cell_tb.txt")
          if not p.exists():
              print("no record written")
              raise SystemExit(0)
          text = p.read_text()
          blocks = re.split(r"(?m)^(?=TEST: )", text)
          interesting = [b for b in blocks if "ExitTrap" not in b]
          print(f"records: {len(blocks)}  non-ExitTrap: {len(interesting)}")
          for b in interesting[:4]:
              print("=" * 60)
              print(b[:2000])
          tests = sorted({b.splitlines()[0] for b in interesting})
          print(f"distinct tests with a non-ExitTrap record: {len(tests)}")
          for t in tests[:12]:
              print(" ", t)
          PY

      - name: Environment
        if: always()
        run: |
          python -VV
          python -c 'import sys,platform;print(sys.executable, platform.machine(), platform.mac_ver())'
