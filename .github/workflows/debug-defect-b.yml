name: Debug defect B (macOS + CPython 3.10.11 guest runs)

# Throwaway diagnostic branch cut from 3094a4b. Purpose: decide whether the
# `list indices must be integers or slices, not function` failure on
# macos-latest / 3.10.11 is (a) our code, (b) wasmtime 47.0.1, (c) this exact
# CPython installer build, or a combination. Never merges.

on:
  push:
    branches: [debug/defect-b-macos310]
  workflow_dispatch:

permissions: read-all

jobs:
  trace:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python-version: ["3.10.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Interpreter identity
        run: |
          python -VV
          python -c 'import sys,platform;print("executable:",sys.executable);print("prefix:",sys.prefix);print("base_exec_prefix:",getattr(sys,"base_exec_prefix",""));print("arch:",platform.architecture(),platform.machine());print("platform:",platform.platform());print("mac_ver:",platform.mac_ver())'
          uname -a
          otool -L "$(python -c 'import sys;print(sys.executable)')" 2>/dev/null | head -8 || true
          ldd "$(python -c 'import sys;print(sys.executable)')" 2>/dev/null | head -8 || true

      - name: Install dependencies (same pins as CI)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest<9" pytest-cov "cryptography>=42"
          python -m pip install -e . --no-deps

      - name: wasmtime provenance (which wheel, from where, which hash)
        run: |
          python -m pip install --dry-run --report /tmp/pip-report.json --no-deps wasmtime==47.0.1 >/dev/null
          python - <<'PY'
          import json
          r = json.load(open("/tmp/pip-report.json"))
          for item in r.get("install", []):
              m = item["download_info"]
              print("distribution :", item["metadata"]["name"], item["metadata"]["version"])
              print("url          :", m["url"])
              print("archive hash :", m.get("archive_info", {}).get("hashes"))
              print("python       :", item.get("build", {}).get("python", "wheel (no build)"))
          PY
          python -c 'import wasmtime,importlib.metadata as M;print("import path:",wasmtime.__file__);print("dist version:",M.version("wasmtime"))'
          python -c 'import pathlib,wasmtime as w;p=pathlib.Path(w.__file__).parent;print("native libs:",[x.name for x in p.rglob("*") if x.suffix in (".so",".dylib")][:8])'

      - name: pip freeze
        run: python -m pip freeze

      - name: Discriminator 1 — raw wasmtime, no Cell code
        continue-on-error: true
        run: python .github/debug/raw_wasmtime.py

      - name: Discriminator 2 — one minimal Cell guest run (traceback at the catch site)
        continue-on-error: true
        env:
          CELL_DEBUG_TRACEBACK: "1"
        run: python -X dev .github/debug/cell_minimal_run.py

      - name: Discriminator 3 — the failing pytest case, full traceback
        continue-on-error: true
        env:
          CELL_DEBUG_TRACEBACK: "1"
        run: |
          python -m pytest "tests/test_security.py::TestSecurityBoundary::test_zero_fuel_fails_immediately" \
            "tests/test_execution_invariants.py::test_ephemeral_invariant" \
            -q --tb=long --no-header -p no:cacheprovider --no-cov

      - name: Environment summary for comparison
        if: always()
        run: |
          echo "os=${{ matrix.os }} python=${{ matrix.python-version }}"
          python -c 'import sys,platform;print(platform.python_version(), platform.machine(), sys.executable)'
