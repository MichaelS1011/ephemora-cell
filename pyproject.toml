[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ephemora-cell"
version = "1.1.0"
description = "Ephemora Cell — The execution layer for untrusted AI-generated code. Fast, capability-based WASM execution with explicit CPU, memory, time, I/O, and filesystem limits."
readme = "README.md"
license = "BUSL-1.1"
# PEP 639: both license documents travel with the wheel (dist-info/licenses/) and
# the sdist. Setting license-files replaces setuptools' auto-detection, so LICENSE
# has to be named explicitly — otherwise the BUSL text would drop out of artifacts.
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    {name = "Michael Soppa"},
]
requires-python = ">=3.10"
dependencies = ["wasmtime>=43.0.1,<50"]  # floor = oldest line carrying the April 2026 advisory fixes (CVE-2026-34971 class); ceiling <50 admits the 49.x engine. Pinned 49.0.0 (requirements.txt) closes the 47.0.0-window advisories fixed by 47.0.3/47.0.4 (GHSA-vqjp High FS-escape, x84v, 2hw9, hgjw); the Sept-24/Oct-2 waves need 48.0.3+/49.0.1+ wheels that do not exist on PyPI (48.0.5/49.0.2 are Rust-only), so those remain open — engine-upgrade gate in docs/decisions/ADR-009-language-support.md, public advisory status in SECURITY.md

classifiers = [
    # 4 - Beta, deliberately not 5 - Production/Stable: the PyPI classifier is read
    # as a production-readiness signal, and this project's own release gate withholds
    # that verdict for untrusted workloads (independent security evaluation not
    # complete; upstream Wasmtime advisories still open on the pinned line). Restore
    # 5 - Production/Stable only once that evaluation has closed. An already
    # published release file cannot be re-labelled, so this takes effect with the
    # next release upload — see docs/release_assurance.md.
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Embedded Systems",
]
keywords = [
    "wasm",
    "webassembly",
    "wasi",
    "sandbox",
    "isolation",
    "agent",
    "mcp",
    "mcp-server",
    "wasmtime",
    "capability-based-security",
    "code-execution",
    "untrusted-code",
]

[project.urls]
Homepage = "https://github.com/MichaelS1011/ephemora-cell"
Documentation = "https://github.com/MichaelS1011/ephemora-cell#readme"
Changelog = "https://github.com/MichaelS1011/ephemora-cell/blob/main/CHANGELOG.md"
Issues = "https://github.com/MichaelS1011/ephemora-cell/issues"

[project.optional-dependencies]
# pytest<10 keeps Python 3.11 support until CI moves off it.
dev = ["pytest<10", "pytest-cov", "black>=24", "ruff>=0.5", "bandit>=1.7", "mypy>=1.8"]
# Official MCP Python SDK — pulls pydantic/uvicorn, so it is kept out of the
# core `dev` extra and `testpaths` and run only as an explicit interop gate.
integration = ["mcp"]
# Ed25519 sign/verify for the ADR-006 signed-tools mode (manifest signing
# utility + --require-signed-tools). Optional on purpose: the library-level
# sign/verify primitives are signer-agnostic (bytes in, bytes out).
tools-signing = ["cryptography>=42"]

[project.scripts]
ephemora-cell = "ephemora_cell.cli:main"
ephemora-cell-mcp = "ephemora_cell_mcp.__main__:main"

[tool.pytest.ini_options]
# integration/ pulls the OpenAI agents SDK (optional, broken in some
# venvs). Scope the default run to the core suite so `pytest` stays green
# for an open-source consumer. Run integration/ explicitly when needed.
# (benchmarks/ holds evidence scripts, not pytest tests — never collected.)
testpaths = ["tests"]
addopts = "--cov=ephemora_cell --cov=ephemora_cell_mcp --cov-report=term-missing"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["BLE001", "S110", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S110"]

[tool.mypy]
# Non-strict type gate (introduced 2026-09-12): production code only,
# pragmatic baseline — enforce, then tighten incrementally.
python_version = "3.10"
files = ["ephemora_cell", "ephemora_cell_mcp"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.setuptools.packages.find]
include = ["ephemora_cell*", "ephemora_cell_mcp*"]
namespaces = false

[tool.setuptools.package-data]
ephemora_cell_mcp = ["tools/*.wasm", "tools/*.json"]
