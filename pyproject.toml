[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ephemora-cell"
version = "1.2.0"
description = "Ephemora Cell — The execution layer for untrusted AI-generated code. Fast, capability-based WASM execution with explicit CPU, memory, time, I/O, and filesystem limits."
readme = "README.md"
license = "BUSL-1.1"
# PEP 639: both license documents travel with the wheel (dist-info/licenses/) and
# the sdist. Setting license-files replaces setuptools' auto-detection, so LICENSE
# has to be named explicitly — otherwise the BUSL text would drop out of artifacts.
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    {name = "Michael Soppa"},
]
requires-python = ">=3.10"
dependencies = ["wasmtime>=49.0.4,<50"]  # fail-closed patched-line floor: the release ships a controlled 49.0.4-engine build (official Bytecode Alliance C-API asset, tarball sha256 f83147d1…5460 verified before embedding; embedded dylib sha256 247c1529…a30b; platform-tagged macosx_11_0_arm64). PyPI still carries no 49.0.4 wheel, so an unconfigured `pip install` resolves UNSATISFIABLE instead of silently pulling a vulnerable 49.0.0–49.0.3 — documented wheelhouse install path in the release notes; other platforms are refused by wheel tag (NOT QUALIFIED). Any future 49.x wheel below 49.0.4 stays out; the floor moves only upward deliberately.

classifiers = [
    # 4 - Beta, deliberately not 5 - Production/Stable: the PyPI classifier is read
    # as a production-readiness signal, and this project's own release gate withholds
    # that verdict for untrusted workloads (independent security evaluation not
    # complete; upstream Wasmtime advisories still open on the pinned line). Restore
    # 5 - Production/Stable only once that evaluation has closed. An already
    # published release file cannot be re-labelled, so this takes effect with the
    # next release upload — see docs/release_assurance.md.
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    # 1.2.x is qualified on macOS arm64 only (see SECURITY.md "Supported platforms");
    # "OS Independent" advertised a portability the release does not carry. The
    # metadata takes effect with the next upload — a published file cannot be re-labelled.
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Embedded Systems",
]
keywords = [
    "wasm",
    "webassembly",
    "wasi",
    "sandbox",
    "isolation",
    "agent",
    "mcp",
    "mcp-server",
    "wasmtime",
    "capability-based-security",
    "code-execution",
    "untrusted-code",
]

[project.urls]
Homepage = "https://github.com/MichaelS1011/ephemora-cell"
Documentation = "https://github.com/MichaelS1011/ephemora-cell#readme"
Changelog = "https://github.com/MichaelS1011/ephemora-cell/blob/main/CHANGELOG.md"
Issues = "https://github.com/MichaelS1011/ephemora-cell/issues"

[project.optional-dependencies]
# pytest<10 keeps Python 3.11 support until CI moves off it.
dev = ["pytest<10", "pytest-cov", "black>=24", "ruff>=0.5", "bandit>=1.7", "mypy>=1.8"]
# Official MCP Python SDK — pulls pydantic/uvicorn, so it is kept out of the
# core `dev` extra and `testpaths` and run only as an explicit interop gate.
# Floor pinned at 2: the SDK interop test drives the 2.x client API
# (streamable-HTTP transport); measured against mcp 1.28.1 it fails.
integration = ["mcp>=2"]
# Ed25519 sign/verify for the ADR-006 signed-tools mode (manifest signing
# utility + --require-signed-tools). Optional on purpose: the library-level
# sign/verify primitives are signer-agnostic (bytes in, bytes out).
tools-signing = ["cryptography>=42"]
# Language guests (ADR-009): installing the extra pulls a
# versioned guest distribution that registers the ``ephemora_cell.language_guest``
# entry point, so ``run_python`` / ``run_javascript`` resolve the guest
# automatically after install — no manual .wasm path, no runtime download, and
# fail-closed (no host-interpreter fallback) when the guest is absent. The guest
# distributions embed CPython (PSF-2.0) / QuickJS (MIT); public-index resolution
# of these extras is gated on publishing those dists + license/SBOM clearance
# Verified end-to-end against a local wheelhouse in the release tests.
python = ["ephemora-cell-python-guest>=1.2.0,<2"]
javascript = ["ephemora-cell-javascript-guest>=1.2.0,<2"]

[project.scripts]
ephemora = "ephemora_cell.cli:main"
ephemora-cell = "ephemora_cell.cli:main"
ephemora-cell-mcp = "ephemora_cell_mcp.__main__:main"

[tool.pytest.ini_options]
# integration/ pulls the OpenAI agents SDK (optional, broken in some
# venvs). Scope the default run to the core suite so `pytest` stays green
# for an open-source consumer. Run integration/ explicitly when needed.
# (benchmarks/ holds evidence scripts, not pytest tests — never collected.)
testpaths = ["tests"]
addopts = "--cov=ephemora_cell --cov=ephemora_cell_mcp --cov-report=term-missing"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["BLE001", "S110", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S110"]

[tool.mypy]
# Non-strict type gate (introduced 2026-09-12): production code only,
# pragmatic baseline — enforce, then tighten incrementally.
python_version = "3.10"
files = ["ephemora_cell", "ephemora_cell_mcp"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# The optional `integration` extra (the MCP SDK and its ASGI stack) is a
# third-party, test-gated dependency: ephemora_cell_mcp.http_bridge imports it
# inside functions only, so the core install never needs it. Type-checking that
# library's own source is not this gate's job — it reported errors inside
# site-packages the moment the bridge started importing `mcp` — so those imports
# are skipped rather than audited. Our own code stays fully checked.
[[tool.mypy.overrides]]
module = [
    "mcp.*",
    "anyio.*",
    "uvicorn.*",
    "starlette.*",
    "httpx.*",
    "httpx2.*",
]
follow_imports = "skip"
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["ephemora_cell*", "ephemora_cell_mcp*"]
namespaces = false

[tool.setuptools.package-data]
ephemora_cell_mcp = ["tools/*.wasm", "tools/*.json"]
