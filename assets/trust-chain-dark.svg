<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img" aria-label="Trust chain: vendor signs manifest, host verifies fail-closed, Cell sandbox runs, signed execution record"><rect width="880" height="250" fill="#0d1117"/><rect x="20" y="70" width="175" height="86" rx="12" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/><text x="107.5" y="98" text-anchor="middle" font-size="14.5" font-weight="600" fill="#e6edf3" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">VENDOR</text><text x="107.5" y="120" text-anchor="middle" font-size="12" fill="#e6edf3" font-family="-apple-system,Segoe UI,sans-serif">signs manifest</text><text x="107.5" y="138" text-anchor="middle" font-size="12" fill="#9198a1" font-family="-apple-system,Segoe UI,sans-serif">Ed25519 · RFC 8785 JCS</text><rect x="255" y="70" width="220" height="86" rx="12" fill="#121d2f" stroke="#4493f8" stroke-width="1.5"/><text x="365.0" y="98" text-anchor="middle" font-size="14.5" font-weight="600" fill="#4493f8" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">HOST VERIFIES</text><text x="365.0" y="120" text-anchor="middle" font-size="12" fill="#e6edf3" font-family="-apple-system,Segoe UI,sans-serif">signature ✓  hash ✓  path ✓</text><text x="365.0" y="138" text-anchor="middle" font-size="12" fill="#9198a1" font-family="-apple-system,Segoe UI,sans-serif">fail-closed at load</text><rect x="530" y="70" width="175" height="86" rx="12" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/><text x="617.5" y="98" text-anchor="middle" font-size="14.5" font-weight="600" fill="#e6edf3" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">CELL SANDBOX</text><text x="617.5" y="120" text-anchor="middle" font-size="12" fill="#e6edf3" font-family="-apple-system,Segoe UI,sans-serif">fuel · memory</text><text x="617.5" y="138" text-anchor="middle" font-size="12" fill="#9198a1" font-family="-apple-system,Segoe UI,sans-serif">timeout · I/O walls</text><rect x="745" y="70" width="115" height="86" rx="12" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/><text x="802.5" y="98" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3fb950" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">SIGNED RECORD</text><text x="802.5" y="120" text-anchor="middle" font-size="12" fill="#e6edf3" font-family="-apple-system,Segoe UI,sans-serif">status · fuel · baseline</text><text x="802.5" y="138" text-anchor="middle" font-size="12" fill="#9198a1" font-family="-apple-system,Segoe UI,sans-serif">tamper-evident</text><line x1="195" y1="113" x2="245" y2="113" stroke="#3d444d" stroke-width="1.5"/><polygon points="245,108 255,113 245,118" fill="#3d444d"/><line x1="475" y1="113" x2="520" y2="113" stroke="#3d444d" stroke-width="1.5"/><polygon points="520,108 530,113 520,118" fill="#3d444d"/><line x1="705" y1="113" x2="735" y2="113" stroke="#3d444d" stroke-width="1.5"/><polygon points="735,108 745,113 735,118" fill="#3d444d"/><line x1="365" y1="156" x2="365" y2="184" stroke="#f85149" stroke-width="1.5" stroke-dasharray="4 3"/><polygon points="360,184 365,194 370,184" fill="#f85149"/><rect x="255" y="196" width="220" height="30" rx="8" fill="none" stroke="#f85149" stroke-dasharray="4 3"/><text x="365" y="215" text-anchor="middle" font-size="12" fill="#f85149" font-family="-apple-system,Segoe UI,sans-serif">✗ unsigned / tampered → REJECTED</text><text x="440" y="244" text-anchor="middle" font-size="12" fill="#9198a1" font-family="-apple-system,Segoe UI,sans-serif">the agent proposes; the host disposes — every step attested (ADR-006)</text></svg>