<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img" aria-label="Trust chain: vendor signs manifest, host verifies fail-closed, Cell sandbox runs, signed execution record"><rect width="880" height="250" fill="#ffffff"/><rect x="20" y="70" width="175" height="86" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/><text x="107.5" y="98" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1f2328" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">VENDOR</text><text x="107.5" y="120" text-anchor="middle" font-size="12" fill="#1f2328" font-family="-apple-system,Segoe UI,sans-serif">signs manifest</text><text x="107.5" y="138" text-anchor="middle" font-size="12" fill="#59636e" font-family="-apple-system,Segoe UI,sans-serif">Ed25519 · RFC 8785 JCS</text><rect x="255" y="70" width="220" height="86" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="365.0" y="98" text-anchor="middle" font-size="14.5" font-weight="600" fill="#0969da" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">HOST VERIFIES</text><text x="365.0" y="120" text-anchor="middle" font-size="12" fill="#1f2328" font-family="-apple-system,Segoe UI,sans-serif">signature ✓  hash ✓  path ✓</text><text x="365.0" y="138" text-anchor="middle" font-size="12" fill="#59636e" font-family="-apple-system,Segoe UI,sans-serif">fail-closed at load</text><rect x="530" y="70" width="175" height="86" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/><text x="617.5" y="98" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1f2328" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">CELL SANDBOX</text><text x="617.5" y="120" text-anchor="middle" font-size="12" fill="#1f2328" font-family="-apple-system,Segoe UI,sans-serif">fuel · memory</text><text x="617.5" y="138" text-anchor="middle" font-size="12" fill="#59636e" font-family="-apple-system,Segoe UI,sans-serif">timeout · I/O walls</text><rect x="745" y="70" width="115" height="86" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/><text x="802.5" y="98" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1a7f37" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">SIGNED RECORD</text><text x="802.5" y="120" text-anchor="middle" font-size="12" fill="#1f2328" font-family="-apple-system,Segoe UI,sans-serif">status · fuel · baseline</text><text x="802.5" y="138" text-anchor="middle" font-size="12" fill="#59636e" font-family="-apple-system,Segoe UI,sans-serif">tamper-evident</text><line x1="195" y1="113" x2="245" y2="113" stroke="#d1d9e0" stroke-width="1.5"/><polygon points="245,108 255,113 245,118" fill="#d1d9e0"/><line x1="475" y1="113" x2="520" y2="113" stroke="#d1d9e0" stroke-width="1.5"/><polygon points="520,108 530,113 520,118" fill="#d1d9e0"/><line x1="705" y1="113" x2="735" y2="113" stroke="#d1d9e0" stroke-width="1.5"/><polygon points="735,108 745,113 735,118" fill="#d1d9e0"/><line x1="365" y1="156" x2="365" y2="184" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="4 3"/><polygon points="360,184 365,194 370,184" fill="#cf222e"/><rect x="255" y="196" width="220" height="30" rx="8" fill="none" stroke="#cf222e" stroke-dasharray="4 3"/><text x="365" y="215" text-anchor="middle" font-size="12" fill="#cf222e" font-family="-apple-system,Segoe UI,sans-serif">✗ unsigned / tampered → REJECTED</text><text x="440" y="244" text-anchor="middle" font-size="12" fill="#59636e" font-family="-apple-system,Segoe UI,sans-serif">the agent proposes; the host disposes — every step attested (ADR-006)</text></svg>