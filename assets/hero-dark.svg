<svg xmlns="http://www.w3.org/2000/svg" width="880" height="404" viewBox="0 0 880 404" role="img" aria-label="One execution lifecycle: an agent hands untrusted code to the Ephemora-cell capability boundary, which grants explicit capabilities and budgets, denies network and process access by default, and returns a bounded result with a signed record while the execution state is destroyed">
<rect width="880" height="404" fill="#0d1117"/>
<rect x="16" y="150" width="132" height="34" rx="8" fill="#1c2128" stroke="#8b949e"/><text x="82.0" y="172" text-anchor="middle" font-size="13.5" fill="#e6edf3" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">AI agent / app</text>
<text x="82" y="207" text-anchor="middle" font-size="12" fill="#a5aeb8" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">untrusted tool code</text>
<text x="82" y="137" text-anchor="middle" font-size="12" fill="#a5aeb8" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">the host decides</text>
<line x1="148" y1="167" x2="186" y2="167" stroke="#8b949e" stroke-width="1.5"/><polygon points="186,162 196,167 186,172" fill="#8b949e"/>
<rect x="200" y="44" width="384" height="258" rx="14" fill="#151b23" stroke="#4493f8" stroke-width="1.5"/>
<text x="392" y="76" text-anchor="middle" font-size="17" font-weight="600" fill="#4493f8" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">EPHEMORA CELL</text>
<text x="392" y="96" text-anchor="middle" font-size="11.5" fill="#a5aeb8" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">capability boundary — one execution at a time</text>
<rect x="216" y="112" width="168" height="34" rx="8" fill="#1c2128" stroke="#8b949e"/><text x="300.0" y="134" text-anchor="middle" font-size="13" fill="#e6edf3" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Explicit capabilities</text>
<rect x="400" y="112" width="168" height="34" rx="8" fill="#1c2128" stroke="#8b949e"/><text x="484.0" y="134" text-anchor="middle" font-size="13" fill="#e6edf3" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Bounded memory</text>
<rect x="216" y="156" width="168" height="34" rx="8" fill="#1c2128" stroke="#8b949e"/><text x="300.0" y="178" text-anchor="middle" font-size="13" fill="#e6edf3" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Fuel + time budgets</text>
<rect x="400" y="156" width="168" height="34" rx="8" fill="#1c2128" stroke="#8b949e"/><text x="484.0" y="178" text-anchor="middle" font-size="13" fill="#e6edf3" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Bounded output</text>
<rect x="216" y="200" width="352" height="34" rx="8" fill="#1c2128" stroke="#8b949e"/><text x="392.0" y="222" text-anchor="middle" font-size="13" fill="#e6edf3" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Host grants them — guest cannot widen</text>
<text x="392" y="262" text-anchor="middle" font-size="13.5" font-weight="700" fill="#f85149" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">network denied by default · no exec/fork</text>
<text x="392" y="282" text-anchor="middle" font-size="12" fill="#f85149" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">no ambient host access — every capability is granted</text>
<line x1="584" y1="141" x2="622" y2="141" stroke="#8b949e" stroke-width="1.5"/><polygon points="622,136 632,141 622,146" fill="#8b949e"/>
<line x1="584" y1="213" x2="622" y2="213" stroke="#8b949e" stroke-width="1.5"/><polygon points="622,208 632,213 622,218" fill="#8b949e"/>
<text x="748" y="116" text-anchor="middle" font-size="11.5" fill="#a5aeb8" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">status · fuel · baseline · attested</text>
<rect x="632" y="124" width="232" height="34" rx="8" fill="#121d2f" stroke="#4493f8"/><text x="748.0" y="146" text-anchor="middle" font-size="13.5" fill="#e6edf3" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">result + signed record</text>
<rect x="632" y="196" width="232" height="34" rx="8" fill="#1c2128" stroke="#8b949e" stroke-dasharray="5 4"/><text x="748.0" y="218" text-anchor="middle" font-size="13.5" fill="#e6edf3" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">execution state destroyed</text>
<text x="748" y="258" text-anchor="middle" font-size="12" fill="#a5aeb8" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">evidence persists · state does not</text>
<text x="440" y="330" text-anchor="middle" font-size="11.5" fill="#a5aeb8" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">one execution, start to finish</text>
<rect x="120" y="338" width="112" height="34" rx="8" fill="#1c2128" stroke="#8b949e"/><text x="176.0" y="360" text-anchor="middle" font-size="12.5" fill="#e6edf3" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">create</text>
<line x1="232" y1="355" x2="242" y2="355" stroke="#8b949e" stroke-width="1.5"/><polygon points="242,350 252,355 242,360" fill="#8b949e"/>
<rect x="252" y="338" width="112" height="34" rx="8" fill="#1c2128" stroke="#8b949e"/><text x="308.0" y="360" text-anchor="middle" font-size="12.5" fill="#e6edf3" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">constrain</text>
<line x1="364" y1="355" x2="374" y2="355" stroke="#8b949e" stroke-width="1.5"/><polygon points="374,350 384,355 374,360" fill="#8b949e"/>
<rect x="384" y="338" width="112" height="34" rx="8" fill="#1c2128" stroke="#8b949e"/><text x="440.0" y="360" text-anchor="middle" font-size="12.5" fill="#e6edf3" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">execute</text>
<line x1="496" y1="355" x2="506" y2="355" stroke="#8b949e" stroke-width="1.5"/><polygon points="506,350 516,355 506,360" fill="#8b949e"/>
<rect x="516" y="338" width="112" height="34" rx="8" fill="#1c2128" stroke="#8b949e"/><text x="572.0" y="360" text-anchor="middle" font-size="12.5" fill="#e6edf3" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">prove</text>
<line x1="628" y1="355" x2="638" y2="355" stroke="#8b949e" stroke-width="1.5"/><polygon points="638,350 648,355 638,360" fill="#8b949e"/>
<rect x="648" y="338" width="112" height="34" rx="8" fill="#1c2128" stroke="#8b949e"/><text x="704.0" y="360" text-anchor="middle" font-size="12.5" fill="#e6edf3" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">destroy</text>
<text x="440" y="398" text-anchor="middle" font-size="12" fill="#a5aeb8" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">nothing carries over: no state, no capability, no authority</text>
</svg>