[package]
name = "sync_probe"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sync_probe"
path = "src/main.rs"

[dependencies]
# WASI 0.2 typed host bindings (facade over wasip2 1.x) — same as times_probe,
# used only to enumerate preopens; the sync call itself goes through std so the
# probe exercises the path a real component guest (componentize-py et al.) takes.
wasi = "0.14"
